# The collector with tail sampling: config.yaml plus one processor, which
# decides which traces Tempo keeps once it has seen them. Chosen with
# `COLLECTOR_CONFIG=tail-sampling.yaml` in `.env`, then
# `docker compose up -d collector`.
#
# Every service still sends every span: the saving is in what is stored,
# not in what is sent. The LLM spans to Phoenix and the logs to Loki are
# not sampled (their pipelines below are config.yaml's).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318   # the services use this one
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Refuse data before the collector runs out of memory, instead of crashing.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  # Send in batches: fewer, larger requests to each backend.
  batch:
    timeout: 2s
  # Phoenix is for LLM work: keep only the spans the Anthropic
  # instrumentation wrote (they carry an `openinference.span.kind`).
  filter/llm-only:
    error_mode: ignore
    traces:
      span:
        - 'attributes["openinference.span.kind"] == nil'
  # Hold each trace's spans in memory, then keep or drop the whole trace.
  tail_sampling:
    # How long after a trace's first span the decision is made. A span
    # reaches the collector only once it has ENDED, so the decision sees
    # only what has finished by then. A complaint's drafter call comes when
    # an agent opens it, 30 s to 2 minutes after routing: 150 s sees most of
    # them. (The default, 30 s, saw neither a slow triage nor a failed
    # draft: measured 2026-11-17.) Spans that arrive later still inherit the
    # decision, while the trace id is remembered.
    decision_wait: 150s
    num_traces: 50000           # traces held in memory at once (the default)
    # A trace is kept if ANY policy says so.
    policies:
      # Every trace with a span in error: a failed LLM call, a 529, a crash.
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      # Every complaint routed more than 30 s after receipt: half the
      # triaged-in-time objective's 60 s, slow enough to explain, early.
      # A condition on ONE span, the one triage writes. Not the `latency`
      # policy: it measures the whole trace, first span to last, and every
      # complaint an agent has opened lasts more than 30 s (measured: it kept
      # all of them).
      - name: slow
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'span.attributes["triage.seconds_since_receipt"] > 30'
      # One in ten of the rest, so a normal complaint can be compared.
      - name: baseline
        type: probabilistic
        probabilistic: {sampling_percentage: 10}

exporters:
  # The kept traces, to Tempo, over gRPC.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true            # inside the lab's network; never across the internet
  # The LLM spans, to Phoenix, over HTTP.
  otlp_http/phoenix:
    endpoint: http://phoenix:6006
  # Every log record, to Loki, which accepts OTLP natively.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    # Sampled: tail_sampling sits before batch, after the memory limit.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    traces/llm:
      receivers: [otlp]
      processors: [memory_limiter, filter/llm-only, batch]
      exporters: [otlp_http/phoenix]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
  # The collector's own metrics, for Prometheus on :8888: with tail sampling
  # they include how many traces each policy kept
  # (otelcol_processor_tail_sampling_*).
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
