# Prometheus: what to collect, how often, and which rules to evaluate.

global:
  # Every target is read every 5 seconds. Real platforms often use 15-60 s;
  # the lab is faster so that an incident shows within a minute.
  scrape_interval: 5s
  # Recording and alerting rules are evaluated every 15 seconds.
  evaluation_interval: 15s

# The SLIs, error budgets and burn-rate alerts.
rule_files:
  - rules.yml

scrape_configs:
  # The HTTP services serve /metrics on their own port, 8000.
  - job_name: services
    static_configs:
      - targets: ["gateway:8000", "drafter:8000"]

  # The workers have no API, so they serve /metrics on a port of their own.
  - job_name: workers
    static_configs:
      - targets: ["triage:9100", "report:9100"]

  # The simulated world: customers, agents, the dispatch desk, the clock.
  - job_name: world
    static_configs:
      - targets: ["world:9100"]

  # Lesson 2: Prometheus's own meter, above all `prometheus_tsdb_head_series`,
  # the number of time series it holds in memory (incident I4).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Lesson 2: the collector's own meter (spans and log records in and out).
  - job_name: collector
    static_configs:
      - targets: ["collector:8888"]

  # Lesson 2: Tempo's own meter, above all the bytes and spans it receives
  # (tempo_distributor_bytes_received_total): what storing traces costs.
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
